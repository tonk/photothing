# Builds and publishes a release when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The tag must be a semantic version (v1.2.3, v1.2.3-rc.1) and CHANGELOG.md must have a section for it,
# which becomes the release notes. A tag with a "-" (v1.2.3-rc.1) is published as a pre-release.
# The release holds, for linux/amd64 and linux/arm64: a tarball, a .deb and an .rpm, plus SHA256SUMS.
#
# Dry run: start the workflow by hand (Actions > Release > Run workflow, or `gh workflow run release.yml`).
# It runs every test and builds every package, as it would for a tag, but publishes nothing. Use it to
# try the workflow, or a change to it, without using up a version number.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a commit, not to a tag that can be moved afterwards; the version is
# in the comment. Dependabot (.github/dependabot.yml) proposes updates.

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NFPM_VERSION: v2.48.0

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag is a semantic version with a CHANGELOG section
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$(scripts/check-release.sh "$GITHUB_REF_NAME")"
          else
            version="0.0.0-dryrun.${GITHUB_RUN_NUMBER}" # a dry run builds under a version that cannot be mistaken for a release
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  test:
    name: Test
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # No optional tools here, so this job does not depend on a package mirror: the tests that need ffmpeg,
      # libheif or exiftool skip themselves. The next job runs them.
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # A test that hangs fails after 12 minutes with a dump of what every goroutine was doing, instead of
      # keeping the job busy for hours. (The first run on a cold build cache is slow: modernc.org/sqlite is large.)
      - run: go test -count=1 -timeout 12m ./...

  test-tools:
    name: Test with ffmpeg, libheif and exiftool
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # ffmpeg alone pulls in about ninety packages, and the runner's package mirror is sometimes very slow
      # (the first run took 25 minutes to download them and never reached the tests). So: retries and timeouts
      # on the connection, a time limit on this step, and a job of its own that does not hold up the build.
      - name: Install the optional tools
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y --no-install-recommends ffmpeg libheif-examples libimage-exiftool-perl
      - name: Show what was installed
        run: |
          ffmpeg -version | head -1
          exiftool -ver
          heif-convert --version || true
          command -v heif-enc || echo "heif-enc is not installed: the HEIC tests will skip"
      # Only the packages whose tests use the tools; the rest was tested in the job above.
      - run: go test -count=1 -timeout 12m ./internal/gallery ./internal/web

  build:
    name: Build ${{ matrix.arch }}
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install nfpm
        run: go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
      - name: Build the binary, tarball, .deb and .rpm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MAINTAINER: ${{ vars.MAINTAINER }}   # optional repository variable: "Name <address>"
        run: packaging/build.sh "${{ matrix.arch }}"

      # The runner is amd64, so only that build can be run. Install the .deb like a user would.
      - name: The tarball's binary reports the tag's version
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tar -xzf "dist/photothing_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/photothing_${VERSION}_linux_amd64/photothing" --version | tee /dev/stderr | grep -F "photothing ${VERSION} "
      - name: The .deb installs, the service runs in its sandbox, and the package removes cleanly
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -x
          dpkg-deb --info dist/photothing_*_amd64.deb
          sudo apt-get install -y ./dist/photothing_*_amd64.deb
          photothing --version | grep -F "photothing ${VERSION} "
          id photothing
          test "$(stat -c '%U:%G %a' /etc/photothing/photothing.conf)" = "root:photothing 640"
          systemd-analyze verify /lib/systemd/system/photothing.service /lib/systemd/system/photothing@.service
          # The configuration is readable by root and the service user only, so commands run as that user
          # (from a directory that user can enter).
          cd /
          sudo -u photothing photothing --config=/etc/photothing/photothing.conf config

          # Start the service as a user would, which puts the unit's sandbox (no capabilities, a system call
          # filter, a read-only file system) to work for real.
          sudo mkdir -p /srv/photos
          sudo systemctl start photothing
          for i in $(seq 1 30); do curl -fsS -o /tmp/login.html http://127.0.0.1:8080/login && break; sleep 1; done
          grep -q PhotoThing /tmp/login.html
          systemctl is-active photothing
          sudo -u photothing test -s /var/lib/photothing/photothing.db   # the state directory works
          # An account made the documented way, as the service user, while the service runs.
          set +x
          pw="$(openssl rand -hex 16)"
          printf '%s\n' "$pw" | sudo -u photothing photothing --config=/etc/photothing/photothing.conf user add ci admin
          set -x
          sudo -u photothing photothing --config=/etc/photothing/photothing.conf user list | grep -q '^ci '
          sudo journalctl -u photothing --no-pager | tail -n 15
          sudo systemctl stop photothing

          sudo apt-get remove -y photothing
          test ! -e /usr/bin/photothing
          test -e /etc/photothing/photothing.conf   # configuration is kept on removal
          sudo test -e /var/lib/photothing/photothing.db # and so is the data (the directory is private to its user)
      - name: What the service logged
        if: failure() && matrix.arch == 'amd64'
        run: |
          sudo journalctl -u photothing --no-pager | tail -n 60 || true
          sudo systemctl status photothing --no-pager || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [verify, build, test-tools]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums and release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd dist && sha256sum photothing* > SHA256SUMS && cat SHA256SUMS)
          scripts/release-notes.sh "$VERSION" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --title "PhotoThing $VERSION" --notes-file notes.md --verify-tag "${flags[@]}"
