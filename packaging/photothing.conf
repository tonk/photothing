# photothing configuration. Every setting, with its default and an explanation, is in
# /usr/share/doc/photothing/config.example. Restart after changing it:  systemctl restart photothing
#
# Start the service once the settings are right:  systemctl enable --now photothing
# Create the first user (run it as the service user, so the files get the right owner):
#   sudo -u photothing photothing --config=/etc/photothing/photothing.conf user add NAME admin

# The directory with your photos (only ever read). The service user "photothing" must be able to read it.
photos = /srv/photos

# Where photothing keeps its database, key and cache. The systemd unit manages /var/lib/photothing.
data = /var/lib/photothing

# Listen on the loopback address and put a reverse proxy (see /usr/share/doc/photothing/nginx.conf.example)
# in front of it. If the proxy runs on this machine, also set:  trusted-proxy = 127.0.0.1
addr = 127.0.0.1:8080
#trusted-proxy = 127.0.0.1

scan-interval = 10m

# Daily backups of the database and key; copy them off the machine as well.
backup-dir   = /var/lib/photothing/backups
backup-every = 24h
backup-keep  = 7
