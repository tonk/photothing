# nfpm (https://nfpm.goreleaser.com) package definition for the .deb and .rpm. Not run by hand: use
# packaging/build.sh, which builds the binary, prepares dist/build/ and sets the variables below.
name: photothing
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: ${MAINTAINER}
license: GPL-3.0-only
description: |
  Self-hosted photo gallery with accounts, MFA and roles
  PhotoThing serves the directories under your photo directory as albums. It has users with optional
  two-factor authentication, viewer/editor/admin roles, per-album access, search, tags, captions,
  and a single static binary with an SQLite database. Video, HEIC and RAW support use the optional
  programs ffmpeg, heif-convert and exiftool when they are installed.

contents:
  - src: dist/build/photothing
    dst: /usr/bin/photothing
    file_info:
      mode: 0755
  - src: dist/build/units/photothing.service
    dst: /lib/systemd/system/photothing.service
    file_info:
      mode: 0644
  - src: dist/build/units/photothing@.service
    dst: /lib/systemd/system/photothing@.service
    file_info:
      mode: 0644
  - src: packaging/photothing.conf
    dst: /etc/photothing/photothing.conf
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: photothing
  - src: config.example
    dst: /usr/share/doc/photothing/config.example
  - src: contrib/nginx.conf.example
    dst: /usr/share/doc/photothing/nginx.conf.example
  - src: contrib/nginx-limits.conf.example
    dst: /usr/share/doc/photothing/nginx-limits.conf.example
  # rpm marks the license file (%license); deb has no such type and would leave the file out.
  - src: LICENSE
    dst: /usr/share/doc/photothing/LICENSE
    type: license
    packager: rpm
  - src: LICENSE
    dst: /usr/share/doc/photothing/LICENSE
    packager: deb
  - src: packaging/copyright
    dst: /usr/share/doc/photothing/copyright
  - src: dist/build/licenses
    dst: /usr/share/doc/photothing/third-party-licenses
    type: tree
  - src: README.md
    dst: /usr/share/doc/photothing/README.md
  - src: CHANGELOG.md
    dst: /usr/share/doc/photothing/CHANGELOG.md

scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh

# The binary is static and needs nothing. These add formats when they are installed.
overrides:
  deb:
    suggests: [ffmpeg, libheif-examples, libimage-exiftool-perl]
  rpm:
    suggests: [ffmpeg, libheif-tools, perl-Image-ExifTool]
