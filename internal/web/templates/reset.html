{{define "content"}}
<form method="post" action="/reset" class="card narrow">
  <div class="hero">{{template "logo"}}</div>
  <h1>{{t "Choose a new password"}}</h1>
  <input type="hidden" name="t" value="{{.Data.Token}}">
  <input type="text" name="username" autocomplete="username" hidden>
  <label>{{t "New password (min. 12 characters)"}} <input type="password" name="new" autocomplete="new-password" minlength="12" required autofocus></label>
  <label>{{t "Confirm new password"}} <input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
  <button class="button">{{t "Change password"}}</button>
</form>
{{end}}
